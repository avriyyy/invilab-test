services:
  db:
    image: mysql:8.0
    container_name: invilab-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invilab
    ports:
      - "3306:3306"
    volumes:
      - invilab-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invilab-db-data:
