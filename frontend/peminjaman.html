<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peminjaman - InviLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1><a href="barang.html">InviLab</a></h1>
  <nav>
    <a href="barang.html">Barang</a>
    <a href="peminjaman.html">Peminjaman</a>
    <a href="kategori.html">Kategori</a>
    <a href="profile.html">Profil</a>
    <a href="#" onclick="logout(); return false;">Keluar</a>
  </nav>
</header>
<main>
  <h2>Daftar Peminjaman</h2>
  <div id="pesan" class="pesan"></div>
  <div class="card">
    <div class="baris">
      <div>
        <label for="filter-status">Status</label>
        <select id="filter-status" onchange="muatPeminjaman(1)">
          <option value="">Semua</option>
          <option>Dipinjam</option>
          <option>Dikembalikan</option>
        </select>
      </div>
    </div>
    <div style="overflow-x:auto; margin-top:14px">
      <table>
        <thead>
          <tr><th>Barang</th><th>Peminjam</th><th>NIM</th><th>Tgl Pinjam</th><th>Tgl Kembali</th><th>Status</th><th id="kolom-aksi">Aksi</th></tr>
        </thead>
        <tbody id="tabel-peminjaman"></tbody>
      </table>
    </div>
    <div class="paginasi">
      <button class="ghost" id="tombol-sebelum" onclick="gantiHalaman(-1)">Sebelumnya</button>
      <span id="info-halaman"></span>
      <button class="ghost" id="tombol-berikut" onclick="gantiHalaman(1)">Berikutnya</button>
    </div>
  </div>
  <div class="card">
    <h3>Pinjam Barang</h3>
    <form id="form-peminjaman">
      <div class="baris">
        <div>
          <label for="barang">Barang</label>
          <select id="barang" required></select>
        </div>
        <div>
          <label for="nama-peminjam">Nama peminjam</label>
          <input id="nama-peminjam" required>
        </div>
      </div>
      <div class="baris">
        <div>
          <label for="nim">NIM</label>
          <input id="nim" required>
        </div>
        <div>
          <label for="tanggal-pinjam">Tanggal pinjam</label>
          <input id="tanggal-pinjam" type="date" required>
        </div>
      </div>
      <div style="margin-top:16px"><button type="submit">Buat Peminjaman</button></div>
    </form>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/peminjaman.js"></script>
</body>
</html>
