<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barang - InviLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1><a href="barang.html">InviLab</a></h1>
  <nav>
    <a href="barang.html">Barang</a>
    <a href="peminjaman.html">Peminjaman</a>
    <a href="kategori.html">Kategori</a>
    <a href="profile.html">Profil</a>
    <a href="#" onclick="logout(); return false;">Keluar</a>
  </nav>
</header>
<main>
  <h2>Daftar Barang</h2>
  <div id="pesan" class="pesan"></div>
  <div class="card">
    <div class="baris">
      <div>
        <label for="cari">Cari barang</label>
        <input id="cari" type="text" placeholder="Nama atau kode barang">
      </div>
      <div><button onclick="muatBarang(1)">Cari</button></div>
    </div>
    <div style="overflow-x:auto; margin-top:14px">
      <table>
        <thead>
          <tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Jumlah</th><th>Kondisi</th><th>Lokasi</th><th id="kolom-aksi">Aksi</th></tr>
        </thead>
        <tbody id="tabel-barang"></tbody>
      </table>
    </div>
    <div class="paginasi">
      <button class="ghost" id="tombol-sebelum" onclick="gantiHalaman(-1)">Sebelumnya</button>
      <span id="info-halaman"></span>
      <button class="ghost" id="tombol-berikut" onclick="gantiHalaman(1)">Berikutnya</button>
    </div>
  </div>
  <div class="card" id="card-form" style="display:none">
    <h3 id="judul-form">Tambah Barang</h3>
    <form id="form-barang">
      <div class="baris">
        <div>
          <label for="kode">Kode barang</label>
          <input id="kode" required>
        </div>
        <div>
          <label for="nama">Nama</label>
          <input id="nama" required>
        </div>
      </div>
      <div class="baris">
        <div>
          <label for="kategori">Kategori</label>
          <select id="kategori" required></select>
        </div>
        <div>
          <label for="jumlah">Jumlah</label>
          <input id="jumlah" type="number" min="0" value="1" required>
        </div>
      </div>
      <div class="baris">
        <div>
          <label for="kondisi">Kondisi</label>
          <select id="kondisi">
            <option>Baik</option>
            <option>Rusak</option>
            <option>Perawatan</option>
          </select>
        </div>
        <div>
          <label for="lokasi">Lokasi</label>
          <input id="lokasi" placeholder="misal Lab A">
        </div>
      </div>
      <div style="margin-top:16px">
        <button type="submit">Simpan</button>
        <button type="button" class="ghost" onclick="tutupForm()">Batal</button>
      </div>
    </form>
  </div>
  <button id="tombol-tambah" onclick="bukaForm()" style="display:none">Tambah Barang</button>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/barang.js"></script>
</body>
</html>
