server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: refresh di route selain / tetap membuka index.html,
    # supaya React Router yang menangani rutenya (bukan 404 dari nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
