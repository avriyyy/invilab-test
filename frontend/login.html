<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - InviLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="form-sempit">
  <div class="card">
    <h2>InviLab</h2>
    <p>Inventaris Laboratorium. Masuk untuk lanjut.</p>
    <div id="pesan" class="pesan"></div>
    <form id="form-login">
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="password">Kata sandi</label>
      <input id="password" type="password" required>
      <div style="margin-top:16px"><button type="submit" id="tombol">Masuk</button></div>
    </form>
    <p>Belum punya akun? <a href="register.html">Daftar</a></p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (localStorage.getItem("token")) location.href = "barang.html";
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const tombol = document.getElementById("tombol");
    tombol.disabled = true;
    tombol.textContent = "Memproses...";
    try {
      const data = await api("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      localStorage.setItem("token", data.data.token);
      localStorage.setItem("user", JSON.stringify(data.data.user));
      location.href = "barang.html";
    } catch (err) {
      tampilPesan(document.getElementById("pesan"), err.message, false);
      tombol.disabled = false;
      tombol.textContent = "Masuk";
    }
  });
</script>
</body>
</html>
